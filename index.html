<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Curated Products Showcase | Discover Well-Designed Premium Products</title>
    <meta name="title" content="Curated Products Showcase | Discover Well-Designed Premium Products" />
    <meta name="description" content="Discover well-designed, carefully curated products across Tech, Workspace, Home, Carry, Books, and Lifestyle. Weekly emails featuring timeless, design-led products for home, work, and life." />
    <meta name="keywords" content="curated products, design products, premium products, tech products, workspace products, home products, lifestyle products, design showcase, product discovery, staff picks" />
    <meta name="author" content="Curated Products Showcase" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    <meta name="theme-color" content="#fafafa" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://yourdomain.com/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta property="og:title" content="Curated Products Showcase | Discover Well-Designed Premium Products" />
    <meta property="og:description" content="Discover well-designed, carefully curated products across Tech, Workspace, Home, Carry, Books, and Lifestyle. Weekly emails featuring timeless, design-led products." />
    <meta property="og:image" content="https://yourdomain.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Curated Products Showcase - Discover premium design products" />
    <meta property="og:site_name" content="Curated Products Showcase" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://yourdomain.com/" />
    <meta name="twitter:title" content="Curated Products Showcase | Discover Well-Designed Premium Products" />
    <meta name="twitter:description" content="Discover well-designed, carefully curated products across Tech, Workspace, Home, Carry, Books, and Lifestyle." />
    <meta name="twitter:image" content="https://yourdomain.com/twitter-image.jpg" />
    <meta name="twitter:image:alt" content="Curated Products Showcase - Discover premium design products" />
    <meta name="twitter:creator" content="@yourtwitterhandle" />
    <meta name="twitter:site" content="@yourtwitterhandle" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Curated Products Showcase",
      "url": "https://yourdomain.com/",
      "description": "Discover well-designed, carefully curated products across Tech, Workspace, Home, Carry, Books, and Lifestyle.",
      "publisher": {
        "@type": "Organization",
        "name": "Curated Products Showcase",
        "logo": {
          "@type": "ImageObject",
          "url": "https://yourdomain.com/logo.png"
        }
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://yourdomain.com/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "Curated Products Showcase",
      "description": "A curated collection of well-designed products across multiple categories including Tech, Workspace, Home, Carry, Books, and Lifestyle.",
      "url": "https://yourdomain.com/",
      "mainEntity": {
        "@type": "ItemList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "item": {
              "@type": "Product",
              "name": "Studio Display",
              "brand": "Apple",
              "category": "Tech"
            }
          }
        ]
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Curated Products Showcase",
      "url": "https://yourdomain.com/",
      "logo": "https://yourdomain.com/logo.png",
      "description": "Discover well-designed, carefully curated products across various categories.",
      "sameAs": [
        "https://twitter.com/yourtwitterhandle",
        "https://instagram.com/yourinstagramhandle",
        "https://facebook.com/yourfacebookpage"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "email": "hello@yourdomain.com"
      }
    }
    </script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['var(--font-space-grotesk)', 'sans-serif'],
              serif: ['var(--font-bona-nova)', 'serif'],
            },
          },
        },
      };
    </script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="/src/index.css">
</head>
  <body class="bg-zinc-50">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
